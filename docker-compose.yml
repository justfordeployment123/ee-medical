services:
  api:
    build:
      context: ./rag-api
    restart: unless-stopped
    env_file: ./rag-api/.env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - api_data:/app/data
    expose:
      - "4000:4000"

  frontend:
    build:
      context: ./front-end
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  api_data:
